<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Eca</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fff5f7;
      color: #333;
    }
    header {
      background: #e879a9;
      color: white;
      text-align: center;
      padding: 25px;
    }
    main {
      padding: 25px;
      text-align: center;
    }
    .produk {
      background: white;
      padding: 20px;
      margin: 15px auto;
      max-width: 300px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
    }
    button {
      background: #e879a9;
      color: white;
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Toko Eca</h1>
    <p>Selamat datang di toko online kami!</p>
  </header>
  <main>
    <h2>Produk Kami</h2>
    <div class="produk">
      <h3>Produk Pertama</h3>
      <p>Harga: Rp25.000</p>
      <button onclick="alert('Silakan hubungi penjual untuk memesan!')">
        Pesan Sekarang
      </button>
    </div>
  </main>
</body>
</html>
